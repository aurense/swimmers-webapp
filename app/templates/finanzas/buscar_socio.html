{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title">🔎 Cobro Rápido</h2>
            <p>Busca al socio por nombre, apellido o número de socio para registrar un nuevo pago.</p>
            
            <div class="form-control w-full mt-4">
                <input type="text" id="searchInput" placeholder="Escribe para buscar..." class="input input-bordered w-full" />
            </div>

            <div id="resultsContainer" class="mt-4 space-y-2"></div>

        </div>
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('resultsContainer');
    // El token CSRF es necesario para las peticiones POST en Flask
    const csrfToken = "{{ csrf_token() }}"; 

    searchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value;

        if (searchTerm.length < 2) {
            resultsContainer.innerHTML = '';
            return;
        }

        fetch('/finanzas/api/buscar_socio', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken 
            },
            body: JSON.stringify({ search_term: searchTerm })
        })
        .then(response => response.json())
        .then(data => {
            resultsContainer.innerHTML = ''; // Limpiar resultados anteriores
            if (data.length > 0) {
                const list = document.createElement('ul');
                list.className = 'menu bg-base-200 w-full rounded-box';
                data.forEach(socio => {
                    const listItem = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `/finanzas/cobrar/${socio.id}`;
                    link.textContent = socio.nombre_completo;
                    listItem.appendChild(link);
                    list.appendChild(listItem);
                });
                resultsContainer.appendChild(list);
            } else {
                resultsContainer.innerHTML = '<p class="text-center text-gray-500">No se encontraron socios.</p>';
            }
        })
        .catch(error => {
            console.error('Error en la búsqueda:', error);
            resultsContainer.innerHTML = '<p class="text-center text-red-500">Error al buscar.</p>';
        });
    });
</script>
{% endblock %}
