{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title mb-4">Cobro Rápido: Buscar Socio</h2>
            
            <!-- Barra de Búsqueda con Alpine.js -->
            <div x-data="{ query: '' }" class="mb-4">
                <input type="text" 
                       x-model="query" 
                       @input.debounce.300ms="search($event.target.value)"
                       placeholder="Buscar por Nombre o Folio..."
                       class="input input-bordered w-full">
                
                <!-- Contenedor de Resultados -->
                <div id="search-results" class="mt-2"></div>
            </div>

            <div class="text-center text-gray-500">
                <p>Escribe al menos 3 caracteres para iniciar la búsqueda.</p>
            </div>
        </div>
    </div>
</div>

<script>
function search(query) {
    if (query.length < 3) {
        document.getElementById('search-results').innerHTML = '';
        return;
    }

    fetch(`/socios/api/buscar?q=${query}`)
        .then(response => response.json())
        .then(data => {
            let resultsHtml = '<div class="list-group">';
            if (data.length > 0) {
                data.forEach(socio => {
                    resultsHtml += `
                        <a href="/finanzas/cobrar/${socio.id}" class="list-group-item list-group-item-action flex items-center p-2 hover:bg-gray-100 rounded-lg">
                            <img src="/static/uploads/${socio.foto}" class="w-10 h-10 rounded-full mr-3">
                            <div>
                                <strong>${socio.nombre}</strong> (${socio.folio})
                                <span class="badge ${socio.es_activo ? 'badge-success' : 'badge-error'} ml-2">${socio.msg_estatus}</span>
                            </div>
                        </a>
                    `;
                });
            } else {
                resultsHtml += '<p class="text-center p-4">No se encontraron socios.</p>';
            }
            resultsHtml += '</div>';
            document.getElementById('search-results').innerHTML = resultsHtml;
        })
        .catch(error => console.error('Error en la búsqueda:', error));
}
</script>
{% endblock %}
